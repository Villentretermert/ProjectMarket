name: Foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q -m "not integration"
      - run: uv run --locked python -m scripts.smoke_local
      - run: uv pip check
      - run: python scripts/validate_requirements.py

  compose:
    name: Docker / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Reject missing Compose credentials
        run: |
          if docker compose config --quiet 2>/dev/null; then
            echo 'Compose unexpectedly accepted missing credentials'
            exit 1
          fi
      - run: python scripts/dev_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: python scripts/smoke_api.py --database ok
      - run: python scripts/smoke_identity.py --bots
      - name: Verify minimal non-root runtime
        run: |
          docker compose exec -T api python -c "import os, importlib.util; assert os.getuid() == 10001, 'runtime must be non-root'; assert not os.path.exists('/app/.env'), 'env file in image'; assert importlib.util.find_spec('pytest') is None, 'test framework in image'; assert importlib.util.find_spec('contracts') is not None, 'runtime schemas missing'; assert importlib.util.find_spec('contracts.reference_model') is None, 'reference model in runtime image'"
      - run: python scripts/smoke_ingestion.py --phase before
      - name: Database outage and recovery
        run: |
          docker compose stop db
          python scripts/smoke_api.py --database unavailable
          docker compose start db
          python scripts/smoke_api.py --database ok
          docker compose restart api
          python scripts/smoke_api.py --database ok
      - run: python scripts/smoke_ingestion.py --phase after
      - run: docker compose exec -T maintenance python -m marketob_api.maintenance --once
      - name: Service status
        if: always()
        run: docker compose ps --all
      - name: Remove only disposable CI resources
        if: always()
        run: docker compose down --volumes

  integration:
    name: PostgreSQL / identity, bots and ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: python scripts/dev_env.py
      - run: docker compose -f compose.yaml -f deploy/compose.test.yaml up db --detach --wait
      - run: uv run --locked python scripts/test_postgres.py
      - name: Remove only disposable CI resources
        if: always()
        run: docker compose -f compose.yaml -f deploy/compose.test.yaml down --volumes
