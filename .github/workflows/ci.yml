name: Foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.9'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - name: Inventory native psycopg libraries
        run: uv run --locked python -m scripts.inspect_psycopg
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q -m "not integration"
      - run: uv run --locked python -m scripts.smoke_local
      - run: uv pip check
      - run: python scripts/validate_requirements.py

  compose:
    name: Docker / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Multiple disposable identity scenarios share one loopback address in this job.
      MARKETOB_AUTH_RATE_LIMIT: 100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.9'
      - name: Reject missing Compose credentials
        run: |
          if docker compose config --quiet 2>/dev/null; then
            echo 'Compose unexpectedly accepted missing credentials'
            exit 1
          fi
      - run: python scripts/dev_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Verify rebuilt database startup helper
        run: docker compose exec -T db gosu --version | grep '^1.19 (go1.26.10 on linux/amd64; gc)$'
      - name: Verify Debian OpenSSL security revision
        run: |
          for service in api db; do
            test "$(docker compose exec -T "$service" dpkg-query -W -f='${Version}\n' libssl3 openssl)" = $'3.0.22-1~deb12u2\n3.0.22-1~deb12u2'
          done
      - run: python scripts/smoke_api.py --database ok
      - run: python scripts/smoke_identity.py --bots
      - run: python -m scripts.smoke_channels
      - name: Verify minimal non-root runtime
        run: |
          docker compose exec -T api python -c "import os, importlib.util; assert os.getuid() == 10001, 'runtime must be non-root'; assert not os.path.exists('/app/.env'), 'env file in image'; assert importlib.util.find_spec('pytest') is None, 'test framework in image'; assert importlib.util.find_spec('contracts') is not None, 'runtime schemas missing'; assert importlib.util.find_spec('contracts.reference_model') is None, 'reference model in runtime image'"
      - name: Verify global build installer is absent
        run: docker compose exec -T api /usr/local/bin/python -c "import importlib.util; assert importlib.util.find_spec('pip') is None"
      - name: Inventory actual API image native libraries
        run: docker compose exec -T api python - < scripts/inspect_psycopg.py
      - run: python scripts/smoke_ingestion.py --phase before
      - run: python -m scripts.smoke_actions --phase before
      - name: Database outage and recovery
        run: |
          docker compose stop db
          python scripts/smoke_api.py --database unavailable
          docker compose start db
          python scripts/smoke_api.py --database ok
          docker compose restart api
          python scripts/smoke_api.py --database ok
      - run: python scripts/smoke_ingestion.py --phase after
      - run: python -m scripts.smoke_actions --phase after
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: uv run --locked python -m scripts.smoke_bots --mode python
      - run: uv run --locked python -m scripts.smoke_bots --mode docker
      - name: Local delivery with verified HTTPS
        run: |
          docker compose -f compose.yaml -f deploy/compose.local.yaml up --build --detach --wait --wait-timeout 180
          mkdir -p .local/delivery
          docker compose -f compose.yaml -f deploy/compose.local.yaml cp proxy:/data/caddy/pki/authorities/local/root.crt .local/delivery/root.crt
          uv run --locked python -m scripts.smoke_delivery --ca .local/delivery/root.crt
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy id -u | grep '^10001$'
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy caddy build-info | grep -F 'go1.26.10'
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy caddy build-info | grep -E 'golang.org/x/net[[:space:]]+v0.62.0'
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy caddy build-info | grep -E 'github.com/go-chi/chi/v5[[:space:]]+v5.4.0'
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy caddy build-info | grep -E 'github.com/go-jose/go-jose/v4[[:space:]]+v4.1.7'
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy apk info -v | grep -x 'curl-8.23.0-r0'
          docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy apk info -v | grep -x 'libcurl-8.23.0-r0'
          # Exercise the updated container client, including CA validation and HTTP/2.
          container_http_version="$(docker compose -f compose.yaml -f deploy/compose.local.yaml exec -T proxy curl --http2 --fail --silent --show-error --cacert /data/caddy/pki/authorities/local/root.crt --output /dev/null --write-out '%{http_version}' https://localhost:8443/health/ready)"
          test "$container_http_version" = '2'
          # The urllib smoke covers HTTP/1.1; require actual HTTP/2 negotiation as well.
          host_http_version="$(curl --http2 --fail --silent --show-error --cacert .local/delivery/root.crt --output /dev/null --write-out '%{http_version}' https://localhost:8443/health/ready)"
          test "$host_http_version" = '2'
      - name: Consistent backup and isolated restore
        run: |
          uv run --locked python -m scripts.backup --compose create .local/delivery/backup
          uv run --locked python -m scripts.backup verify .local/delivery/backup
          uv run --locked python -m scripts.backup --compose restore .local/delivery/backup --new-database marketob_recovered
          # Switch only the disposable CI stack, keeping its original database intact.
          docker compose -f compose.yaml -f deploy/compose.local.yaml stop proxy api maintenance
          MARKETOB_DB_NAME=marketob_recovered docker compose -f compose.yaml -f deploy/compose.local.yaml up --detach --wait --wait-timeout 120
          python scripts/smoke_api.py --database ok
          uv run --locked python -m scripts.smoke_delivery --ca .local/delivery/root.crt
          docker compose -f compose.yaml -f deploy/compose.local.yaml stop proxy api maintenance
          docker compose -f compose.yaml -f deploy/compose.local.yaml up --detach --wait --wait-timeout 120
      - run: docker compose exec -T maintenance python -m marketob_api.maintenance --once
      - name: Service status
        if: always()
        run: docker compose ps --all
      - name: Remove only disposable CI resources
        if: always()
        run: docker compose -f compose.yaml -f deploy/compose.local.yaml down --volumes

  integration:
    name: PostgreSQL / identity, bots, ingestion and channels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_COMPOSE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.9'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked
      - run: python scripts/dev_env.py
      - run: docker compose -f compose.yaml -f deploy/compose.test.yaml up db --build --detach --wait
      - run: uv run --locked python scripts/test_postgres.py
      - run: uv run --locked python scripts/test_postgres.py --backend
      - name: Browser acceptance dependencies
        working-directory: apps/client
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # Hosted Ubuntu already supplies Chromium runtime libraries. Avoid apt mirror upgrades.
          npx playwright install chromium
      - run: uv run --locked python scripts/test_postgres.py --web
      - name: Remove only disposable CI resources
        if: always()
        run: docker compose -f compose.yaml -f deploy/compose.test.yaml down --volumes
