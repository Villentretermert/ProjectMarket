[project]
name = "marketob-api"
version = "0.1.0"
description = "MarkeTOB local API foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "marketob-contracts",
  "argon2-cffi==25.1.0",
  "fastapi==0.159.1",
  "pydantic-settings==2.16.1",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "jsonschema-rs==0.57.1",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
marketob-contracts = { workspace = true }

[project.scripts]
marketob-api = "marketob_api.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
