[project]
name = "marketob-api"
version = "0.1.0"
description = "MarkeTOB local API foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.159.1",
  "pydantic-settings==2.16.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.scripts]
marketob-api = "marketob_api.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
