name: marketob
x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
services:
  db:
    logging: *bounded-logging
    image: marketob-db:${MARKETOB_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.db
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: marketob
      POSTGRES_DB: ${MARKETOB_DB_NAME:-marketob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/dev_env.py first}
    volumes:
      # PostgreSQL 18 keeps versioned PGDATA below /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketob -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
  api:
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}
    image: marketob-api:${MARKETOB_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      MARKETOB_DATABASE_URL: postgresql://marketob:${POSTGRES_PASSWORD:?Run python scripts/dev_env.py first}@db:5432/${MARKETOB_DB_NAME:-marketob}
      MARKETOB_ALLOWED_ORIGINS: ${MARKETOB_ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000"]}
      MARKETOB_AUTH_RATE_LIMIT: ${MARKETOB_AUTH_RATE_LIMIT:-10}
      MARKETOB_API_WORKERS: ${MARKETOB_API_WORKERS:-2}
    ports:
      - "127.0.0.1:${MARKETOB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  migrate:
    logging: *bounded-logging
    image: marketob-api:${MARKETOB_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      MARKETOB_DATABASE_URL: postgresql://marketob:${POSTGRES_PASSWORD:?Run python scripts/dev_env.py first}@db:5432/${MARKETOB_DB_NAME:-marketob}
    command: ["python", "-m", "marketob_api.migrate"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  maintenance:
    logging: *bounded-logging
    image: marketob-api:${MARKETOB_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      MARKETOB_DATABASE_URL: postgresql://marketob:${POSTGRES_PASSWORD:?Run python scripts/dev_env.py first}@db:5432/${MARKETOB_DB_NAME:-marketob}
    command: ["python", "-m", "marketob_api.maintenance"]
    healthcheck:
      test: ["CMD", "python", "-m", "marketob_api.maintenance", "--health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
