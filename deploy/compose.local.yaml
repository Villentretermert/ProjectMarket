# Optional local delivery overlay. All published ports remain loopback-only.
services:
  db:
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 256
  api:
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    environment:
      MARKETOB_ALLOWED_ORIGINS: ${MARKETOB_ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000","https://localhost:8443"]}
  maintenance:
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
  proxy:
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
    image: marketob-proxy:${MARKETOB_RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - proxy_data:/data
      - proxy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
volumes:
  proxy_data:
  proxy_config:
