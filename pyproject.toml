[project]
license = "Apache-2.0"
name = "marketob-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "marketob-api[binary]",
  "marketob-contracts",
  "marketob-bot-sdk",
  "marketob-demo-bots",
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"
# The psycopg-c sdist includes generated C; Cython is not needed.
build-constraint-dependencies = [
  { requirement = "setuptools==83.0.0", hashes = ["sha256:29b23c360f22f414dc7336bb39178cc7bcbf6021ed2733cde173f09dba19abb3"] },
  { requirement = "wheel==0.48.0", hashes = ["sha256:3217dcc807155e45db462d7ef2431f5ddda0d7273b700d05a67b271ceb1287ab"] },
  { requirement = "packaging==26.2", hashes = ["sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e"] },
]

[tool.uv.workspace]
members = ["apps/api", "packages/contracts", "packages/bot-sdk", "bots/pilot"]

[tool.uv.sources]
marketob-api = { workspace = true }
marketob-contracts = { workspace = true }
marketob-bot-sdk = { workspace = true }
marketob-demo-bots = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/contracts/tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["integration: requires an explicitly configured PostgreSQL test database"]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["apps/api/**/*.py", "tests/**/*.py", "scripts/audit_dependencies.py", "scripts/collect_notices.py", "scripts/inspect_psycopg.py", "scripts/operations.py", "scripts/live_load.py", "scripts/load_integrity.py", "scripts/host_samples.py", "scripts/docker_lab.py", "scripts/backup.py", "scripts/dev_env.py", "scripts/test_postgres.py", "scripts/smoke_*.py", "scripts/pilot_bots.py", "scripts/backend_lab.py", "scripts/load_backend.py", "scripts/fault_bot.py", "bots/examples/*.py", "packages/bot-sdk/**/*.py", "bots/pilot/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
files = ["apps/api/src", "tests", "scripts/audit_dependencies.py", "scripts/collect_notices.py", "scripts/inspect_psycopg.py", "scripts/operations.py", "scripts/live_load.py", "scripts/load_integrity.py", "scripts/host_samples.py", "scripts/docker_lab.py", "scripts/backup.py", "scripts/smoke_delivery.py", "scripts/smoke_psycopg.py", "scripts/dev_env.py", "scripts/test_postgres.py", "scripts/smoke_api.py", "scripts/smoke_local.py", "scripts/smoke_identity.py", "scripts/smoke_ingestion.py", "scripts/smoke_channels.py", "scripts/smoke_actions.py", "scripts/smoke_bots.py", "scripts/pilot_bots.py", "scripts/backend_lab.py", "scripts/load_backend.py", "scripts/fault_bot.py", "scripts/smoke_backend.py", "scripts/smoke_web.py", "bots/examples", "packages/bot-sdk/src", "bots/pilot/src"]
