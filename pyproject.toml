[project]
name = "marketob-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "marketob-api",
  "marketob-contracts",
  "marketob-bot-sdk",
  "marketob-demo-bots",
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.uv.workspace]
members = ["apps/api", "packages/contracts", "packages/bot-sdk", "bots/pilot"]

[tool.uv.sources]
marketob-api = { workspace = true }
marketob-contracts = { workspace = true }
marketob-bot-sdk = { workspace = true }
marketob-demo-bots = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/contracts/tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["integration: requires an explicitly configured PostgreSQL test database"]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["apps/api/**/*.py", "tests/**/*.py", "scripts/dev_env.py", "scripts/test_postgres.py", "scripts/smoke_*.py", "scripts/pilot_bots.py", "scripts/backend_lab.py", "scripts/load_backend.py", "scripts/fault_bot.py", "bots/examples/*.py", "packages/bot-sdk/**/*.py", "bots/pilot/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
files = ["apps/api/src", "tests", "scripts/dev_env.py", "scripts/test_postgres.py", "scripts/smoke_api.py", "scripts/smoke_local.py", "scripts/smoke_identity.py", "scripts/smoke_ingestion.py", "scripts/smoke_channels.py", "scripts/smoke_actions.py", "scripts/smoke_bots.py", "scripts/pilot_bots.py", "scripts/backend_lab.py", "scripts/load_backend.py", "scripts/fault_bot.py", "scripts/smoke_backend.py", "scripts/smoke_web.py", "bots/examples", "packages/bot-sdk/src", "bots/pilot/src"]
