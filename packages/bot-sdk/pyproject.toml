[project]
name = "marketob-bot-sdk"
version = "0.1.0"
description = "Typed HTTP-only client for MarkeTOB bots"
requires-python = ">=3.14,<3.15"
dependencies = ["marketob-contracts"]

[tool.uv.sources]
marketob-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketob_sdk"]
